<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='4' fill='%23e05a9a'/%3E%3Crect x='3' y='5' width='26' height='7' rx='3' fill='%23a3155b'/%3E%3Ccircle cx='16' cy='21' r='4' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>Planificator de concediu</title>
    <script>
      // Never inside another site's frame (clickjacking): GitHub Pages can't send X-Frame-Options,
      // so the page leaves the frame, or stays blank if the frame forbids that.
      if (window.top !== window.self) {
        document.documentElement.style.display = 'none';
        try {
          window.top.location = window.location.href;
        } catch {}
      }
      // Colour scheme and mode before first paint, so there is no flash (ui/theme.ts keeps them in sync).
      try {
        let s = localStorage.getItem('vacation-planner.scheme');
        if (!['roz', 'neutru', 'contrast'].includes(s)) s = 'roz';
        let m = localStorage.getItem('vacation-planner.mode');
        if (m !== 'light' && m !== 'dark') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.scheme = s;
        document.documentElement.dataset.mode = m;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
